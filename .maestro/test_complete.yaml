appId: com.calsync.app
---
# CalSync Complete Test Suite v5
# Phase 1-3 Tests

# --- TC-001: App已启动 ---
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "月历"

# --- TC-002: 底部导航切换 ---
- tapOn: "周历"
- waitForAnimationToEnd
- tapOn: "日历"
- waitForAnimationToEnd
- tapOn: "日程"
- waitForAnimationToEnd
- tapOn: "待办"
- waitForAnimationToEnd
- tapOn: "月历"
- waitForAnimationToEnd
- assertVisible: "月历"

# --- TC-G01: MonthView 滑动 ---
- swipe:
    direction: "LEFT"
    percentage: 50
- waitForAnimationToEnd
- swipe:
    direction: "RIGHT"
    percentage: 50
- waitForAnimationToEnd

# --- TC-G02: WeekView 滑动 ---
- tapOn: "周历"
- waitForAnimationToEnd
- swipe:
    direction: "LEFT"
    percentage: 50
- waitForAnimationToEnd
- swipe:
    direction: "RIGHT"
    percentage: 50
- waitForAnimationToEnd

# --- TC-G03: DayView 滑动 ---
- tapOn: "日历"
- waitForAnimationToEnd
- swipe:
    direction: "LEFT"
    percentage: 50
- waitForAnimationToEnd
- swipe:
    direction: "RIGHT"
    percentage: 50
- waitForAnimationToEnd

# --- TC-E01: 创建事件 ---
- tapOn: "月历"
- waitForAnimationToEnd
- tapOn: "添加事件"
- waitForAnimationToEnd
- assertVisible: "保存"
- tapOn:
    point: "50%,11%"
- inputText: "test"
- tapOn: "保存"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: "月历"

