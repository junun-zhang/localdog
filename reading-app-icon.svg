<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background with rounded corners -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- App icon background -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bgGradient)"/>
  
  <!-- Open book -->
  <g transform="translate(256, 280)">
    <!-- Left page -->
    <path d="M -100 -80 L -100 80 L 0 60 L 0 -100 Z" fill="url(#bookGradient)" stroke="#E0E0E0" stroke-width="3"/>
    <!-- Right page -->
    <path d="M 0 -100 L 0 60 L 100 80 L 100 -80 Z" fill="url(#bookGradient)" stroke="#E0E0E0" stroke-width="3"/>
    <!-- Book spine -->
    <line x1="0" y1="-100" x2="0" y2="60" stroke="#D0D0D0" stroke-width="4"/>
    <!-- Text lines on left page -->
    <line x1="-80" y1="-50" x2="-20" y2="-50" stroke="#CCCCCC" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="-30" x2="-20" y2="-30" stroke="#CCCCCC" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="-10" x2="-20" y2="-10" stroke="#CCCCCC" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="10" x2="-20" y2="10" stroke="#CCCCCC" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="30" x2="-20" y2="30" stroke="#CCCCCC" stroke-width="3" stroke-linecap="round"/>
    <!-- Text lines on right page -->
    <line x1="20" y1="-50" x2="80" y2="-50" stroke="#CCCCCC" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="-30" x2="80" y2="-30" stroke="#CCCCCC" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="-10" x2="80" y2="-10" stroke="#CCCCCC" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="10" x2="80" y2="10" stroke="#CCCCCC" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="30" x2="80" y2="30" stroke="#CCCCCC" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative bookmark ribbon -->
  <path d="M 256 140 L 256 200 L 280 180 L 280 140 Z" fill="#FF4757"/>
</svg>
