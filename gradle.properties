# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# JVM 参数 - Kapt 需要的 JDK API
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8   --add-opens jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED   --add-opens jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED   --add-opens jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED   --add-opens jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED   --add-opens jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED   --add-opens jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED   --add-opens jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED   --add-opens jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED   --add-opens jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# 性能优化
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# 国内网络优化 - 超时设置
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000

org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
